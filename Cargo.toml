[package]
name = "cabecada"
version = "1.0.0"
edition = "2021"

[dependencies]
macroquad = { version = "0.4", default-features = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_System_Threading"] }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

# Android build (cargo-quad-apk). Needs the INTERNET permission for local-network play.
[package.metadata.android]
# cargo-quad-apk loads the game library named after the LAST part of package_name
# (System.loadLibrary), so it must end in ".cabecada", the crate name. With
# "local.cabecada.futebol" the app looked for libfutebol.so and closed at once.
package_name = "local.futebol.cabecada"
label = "Cabeçada"
version_code = 2
version_name = "1.0.0"
target_sdk_version = 35
min_sdk_version = 21
# x86_64 is for the emulator test (and Chromebooks); phones use the two ARM ones.
build_targets = ["armv7-linux-androideabi", "aarch64-linux-android", "x86_64-linux-android"]
fullscreen = true
icon = "@mipmap/ic_launcher"
res = "android/res"

[package.metadata.android.activity_attributes]
"android:screenOrientation" = "userLandscape"
# Android 12+ (target SDK 31) refuses to install an app whose launcher activity has no explicit "exported".
"android:exported" = "true"

[[package.metadata.android.permission]]
name = "android.permission.INTERNET"

[[package.metadata.android.permission]]
name = "android.permission.ACCESS_WIFI_STATE"

[[package.metadata.android.permission]]
name = "android.permission.ACCESS_NETWORK_STATE"

[[package.metadata.android.permission]]
name = "android.permission.CHANGE_WIFI_MULTICAST_STATE"
