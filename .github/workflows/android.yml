name: Android APK

# Builds the phone version (APK) of Cabecada in the cloud (takes about 5 minutes).
# Run it by hand: Actions tab -> "Android APK" -> Run workflow. It also runs by itself
# when game files change on main. The APK appears at the bottom of the run, in "Artifacts"
# (cabecada-apk).
#
# Signing: when the repository has the secrets ANDROID_KEYSTORE_BASE64 (the .jks file in
# base64) and ANDROID_KEYSTORE_PASSWORD, every APK is signed with that same key, so a new
# APK installs over the old one. Without them the APK keeps a throw-away debug signature.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['src/**', 'assets/**', 'android/**', 'quad.toml', 'Cargo.toml', 'Cargo.lock', '.github/workflows/android.yml']

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      HAS_SIGNING_KEY: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' && secrets.ANDROID_KEYSTORE_PASSWORD != '' }}
    steps:
      - uses: actions/checkout@v4

      # The cargo inside cargo-quad-apk does not understand lock file version 4.
      # Version 3 has the same content when there are no git dependencies.
      - name: Use lock file version 3
        run: sed -i 's/^version = 4$/version = 3/' Cargo.lock && head -3 Cargo.lock

      # Android only installs an update when its version code is not lower than the
      # installed one: use the run number, which grows with every build.
      - name: Version code = run number
        run: |
          sed -i "s/^version_code = .*/version_code = ${{ github.run_number }}/" Cargo.toml
          grep -E '^version_(code|name)' Cargo.toml

      - name: Build the APK (cargo-quad-apk in the notfl3/cargo-apk image)
        run: |
          docker run --rm -v "$PWD":/root/src -w /root/src notfl3/cargo-apk sh -c '
            set -ex
            # the image ships Rust 1.79, but some libraries (fontdue) need a newer one
            rustup toolchain install stable --profile minimal \
              -t armv7-linux-androideabi -t aarch64-linux-android -t i686-linux-android -t x86_64-linux-android
            rustup default stable
            rustc --version; cargo --version
            echo "ANDROID_HOME=$ANDROID_HOME NDK_HOME=$NDK_HOME"
            cargo quad-apk build --release
          '

      - name: Sign with the project key
        if: env.HAS_SIGNING_KEY == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -e
          sudo chown -R "$(id -u):$(id -g)" target
          printf '%s' "$KEYSTORE_BASE64" | tr -d '\r\n ' | base64 -d > "$RUNNER_TEMP/cabecada.jks"
          export SIGNING_PASSWORD="$(printf '%s' "$KEYSTORE_PASSWORD" | tr -d '\r\n')"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)
          APK=target/android-artifacts/release/apk/cabecada.apk
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/cabecada.jks" --ks-pass env:SIGNING_PASSWORD "$APK"
          rm -f "$RUNNER_TEMP/cabecada.jks"
          # fails the step if the signature is not valid; then shows who signed it
          "$BT/apksigner" verify --verbose --print-certs "$APK" > "$RUNNER_TEMP/verify.txt" 2>/dev/null
          grep -iE 'certificate (DN|SHA-256)' "$RUNNER_TEMP/verify.txt" || cat "$RUNNER_TEMP/verify.txt"

      - name: Show the result
        run: |
          ls -l target/android-artifacts/release/apk/
          if [ "$HAS_SIGNING_KEY" != "true" ]; then echo "::warning::No signing key secrets: this APK has a throw-away debug signature."; fi

      - uses: actions/upload-artifact@v4
        with:
          name: cabecada-apk
          path: target/android-artifacts/release/apk/*.apk
          if-no-files-found: error
