name: Android APK

# Builds the phone version (APK) of Cabecada in the cloud (takes about 5 minutes).
# Run it by hand: Actions tab -> "Android APK" -> Run workflow. It also runs by itself
# when game files change on main. The APK appears at the bottom of the run, in "Artifacts"
# (cabecada-apk). It is signed with a debug key, which is fine for installing on a phone.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['src/**', 'assets/**', 'android/**', 'quad.toml', 'Cargo.toml', 'Cargo.lock', '.github/workflows/android.yml']

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The cargo inside cargo-quad-apk does not understand lock file version 4.
      # Version 3 has the same content when there are no git dependencies.
      - name: Use lock file version 3
        run: sed -i 's/^version = 4$/version = 3/' Cargo.lock && head -3 Cargo.lock

      - name: Build the APK (cargo-quad-apk in the notfl3/cargo-apk image)
        run: |
          docker run --rm -v "$PWD":/root/src -w /root/src notfl3/cargo-apk sh -c '
            set -ex
            # the image ships Rust 1.79, but some libraries (fontdue) need a newer one
            rustup toolchain install stable --profile minimal \
              -t armv7-linux-androideabi -t aarch64-linux-android -t i686-linux-android -t x86_64-linux-android
            rustup default stable
            rustc --version; cargo --version
            echo "ANDROID_HOME=$ANDROID_HOME NDK_HOME=$NDK_HOME"
            cargo quad-apk build --release
          '

      - name: Show the result
        run: ls -l target/android-artifacts/release/apk/

      - uses: actions/upload-artifact@v4
        with:
          name: cabecada-apk
          path: target/android-artifacts/release/apk/*.apk
          if-no-files-found: error
